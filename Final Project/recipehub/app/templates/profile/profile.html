
{% extends 'base.html' %}
{% block title %}My Profile – RecipeHub{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body d-flex flex-column flex-md-row align-items-center gap-4 p-4">
    <img src="{{ user.avatar_url }}" class="avatar-lg rounded-circle" alt="Profile image"
         onerror="this.src='https://ui-avatars.com/api/?name={{ user.name|urlencode }}&size=160'">
    <div class="text-center text-md-start">
      <h2 class="mb-1">{{ user.name }}</h2>
      <p class="text-muted mb-1">{{ user.email }}</p>
      <p class="text-muted small">Member since {{ user.created_at.strftime('%d %B %Y') }}</p>
      <a href="{{ url_for('profile.edit_profile') }}" class="btn btn-outline-primary btn-sm">Edit profile</a>
    </div>
  </div>
</div>

<h4 class="mb-3">My recipes ({{ recipes|length }})</h4>
{% include 'profile/_recipe_list.html' %}
{% endblock %}
