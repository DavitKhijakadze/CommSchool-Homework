

{% if recipes %}
  <div class="list-group shadow-sm">
    {% for recipe in recipes %}
      <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
         href="{{ url_for('recipes.detail', recipe_id=recipe.id) }}">
        <span>
          <strong>{{ recipe.title }}</strong>
          <span class="badge bg-light text-dark ms-2">{{ recipe.category }}</span>
        </span>
        <small class="text-muted">{{ recipe.created_at.strftime('%d %b %Y') }}</small>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p class="text-muted">No recipes yet.</p>
{% endif %}
